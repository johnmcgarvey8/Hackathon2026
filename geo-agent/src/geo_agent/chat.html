<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GEO | Evidence Chat</title>
<script>
(() => {
  const param = new URLSearchParams(window.location.search).get("scoutTheme");
  const theme = param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  document.documentElement.setAttribute("data-theme", theme);
})();
</script>
<style>
:root {
  color-scheme: light;
  --cp-bg: #f7f4ef;
  --cp-bg-elevated: #fcfbf8;
  --cp-surface: #ffffff;
  --cp-surface-soft: #f5f5f5;
  --cp-border: #dedede;
  --cp-border-strong: #919191;
  --cp-text: #242424;
  --cp-text-muted: #5c5c5c;
  --cp-text-soft: #6f6f6f;
  --cp-accent: #b11f4b;
  --cp-accent-hover: #9a1a41;
  --cp-accent-soft: rgba(177, 31, 75, 0.08);
  --cp-accent-fg: #ffffff;
  --cp-success: #16a34a;
  --cp-danger: #dc2626;
  --cp-warning: #f59e0b;
  --cp-link: #0078d4;
  --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
  --cp-overlay: rgba(255, 255, 255, 0.8);
  --cp-panel: rgba(255, 255, 255, 0.86);
  --cp-panel-strong: rgba(255, 255, 255, 0.96);
  --cp-sheen: rgba(255, 255, 255, 0.55);
  --cp-highlight: rgba(177, 31, 75, 0.12);
}
html[data-theme="dark"] {
  color-scheme: dark;
  --cp-bg: #3d3b3a;
  --cp-bg-elevated: #343231;
  --cp-surface: #292929;
  --cp-surface-soft: #2e2e2e;
  --cp-border: #474747;
  --cp-border-strong: #5f5f5f;
  --cp-text: #dedede;
  --cp-text-muted: #919191;
  --cp-text-soft: #b0b0b0;
  --cp-accent: #fd8ea1;
  --cp-accent-hover: #fb7b91;
  --cp-accent-soft: rgba(253, 142, 161, 0.14);
  --cp-accent-fg: #1a1a1a;
  --cp-success: #4ade80;
  --cp-danger: #f87171;
  --cp-warning: #fbbf24;
  --cp-link: #4da6ff;
  --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
  --cp-overlay: rgba(41, 41, 41, 0.88);
  --cp-panel: rgba(41, 41, 41, 0.72);
  --cp-panel-strong: rgba(41, 41, 41, 0.96);
  --cp-sheen: rgba(255, 255, 255, 0.04);
  --cp-highlight: rgba(253, 142, 161, 0.12);
}
* { box-sizing: border-box; letter-spacing: 0; }
body { margin: 0; background: var(--cp-bg); color: var(--cp-text); font: 16px/1.55 "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif; }
header { background: var(--cp-surface); border-bottom: 1px solid var(--cp-border); padding: 18px 28px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; gap: 16px; align-items: center; }
.mark { color: var(--cp-accent); font-weight: 800; font-size: 25px; border-right: 1px solid var(--cp-border); padding-right: 16px; }
h1 { font-size: 18px; margin: 0; font-weight: 600; }
.muted, small { color: var(--cp-text-muted); }
main { max-width: 920px; margin: 0 auto; padding: 24px; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
input, textarea, button { font: inherit; border: 1px solid var(--cp-border-strong); border-radius: 8px; padding: 10px 12px; color: var(--cp-text); background: var(--cp-surface); }
input { min-width: 0; flex: 1; }
button { cursor: pointer; white-space: nowrap; }
button:hover { background: var(--cp-surface-soft); }
button:disabled { opacity: .5; cursor: default; }
button.primary { background: var(--cp-accent); color: var(--cp-accent-fg); border-color: var(--cp-accent); }
button.primary:hover { background: var(--cp-accent-hover); }
:focus-visible { outline: 2px solid var(--cp-link); outline-offset: 3px; }
[hidden] { display: none !important; }
#connection { border-bottom: 1px solid var(--cp-border); padding-bottom: 24px; margin-bottom: 24px; }
#connection label { display: block; margin-bottom: 8px; }
#status { min-height: 28px; margin: 8px 0; color: var(--cp-text-muted); overflow-wrap: anywhere; }
#status.error { color: var(--cp-danger); }
#run { display: block; font-size: 13px; overflow-wrap: anywhere; margin-bottom: 12px; }
#messages { min-height: 240px; }
.turn { border-bottom: 1px solid var(--cp-border); padding: 24px 0; }
.speaker { font-size: 12px; font-weight: 700; text-transform: uppercase; color: var(--cp-accent); margin-bottom: 8px; }
.user { background: var(--cp-accent-soft); padding: 14px 18px; border-radius: 8px; margin-bottom: 20px; white-space: pre-wrap; overflow-wrap: anywhere; }
.answer { white-space: pre-wrap; overflow-wrap: anywhere; }
.answer a { color: var(--cp-link); }
.answer.error { color: var(--cp-danger); }
.turn small { display: block; margin-top: 12px; }
#empty { padding: 64px 0; text-align: center; }
#empty strong { display: block; font-size: 24px; font-weight: 600; }
#composer { position: sticky; bottom: 0; padding: 20px 0; background: var(--cp-bg); }
textarea { display: block; width: 100%; resize: vertical; min-height: 100px; max-height: 280px; }
.compose-actions { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-top: 10px; }
.tabs { display: flex; gap: 24px; border-bottom: 1px solid var(--cp-border); margin-bottom: 24px; }
.tabs button { border: 0; border-radius: 0; border-bottom: 3px solid var(--cp-border); padding: 12px 0; background: var(--cp-bg); }
.tabs button[aria-selected="true"] { border-color: var(--cp-accent); color: var(--cp-accent); font-weight: 600; }
.analysis-section { padding: 20px 0; border-bottom: 1px solid var(--cp-border); overflow-wrap: anywhere; }
.analysis-section h2 { font-size: 20px; margin: 0 0 12px; }
.analysis-section h3 { font-size: 16px; margin: 16px 0 8px; }
.analysis-section p { margin: 8px 0; }
.analysis-section label { display: block; margin: 12px 0 6px; }
.analysis-section input:not([type="checkbox"]), select { width: 100%; min-width: 0; }
select { padding: 10px; font: inherit; color: var(--cp-text); background: var(--cp-surface); border: 1px solid var(--cp-border-strong); border-radius: 8px; }
input[type="checkbox"] { width: 18px; height: 18px; flex: none; accent-color: var(--cp-accent); }
blockquote { margin: 8px 0; padding: 8px 16px; border-left: 3px solid var(--cp-border-strong); color: var(--cp-text-muted); white-space: pre-wrap; }
.analysis-section a { color: var(--cp-link); }
.finding { margin: 12px 0 20px; }
.basis { font-size: 12px; text-transform: uppercase; color: var(--cp-accent); font-weight: 700; }
details { margin: 12px 0; }
summary { cursor: pointer; font-weight: 600; }
.limits { font-size: 14px; color: var(--cp-text-muted); }
@media (max-width: 600px) { header { padding: 16px; } main { padding: 16px; } .toolbar input { flex-basis: 100%; } .brand { gap: 10px; } #empty { padding: 40px 0; } }
@media (prefers-reduced-motion: no-preference) { .turn { animation: appear .2s ease-out; } @keyframes appear { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } } }
</style>
</head>
<body>
<header><div class="brand"><span class="mark">GEO</span><div><h1>Page Analysis &amp; Evidence Chat</h1><small>Local workspace</small></div></div><span id="budget" class="muted">Not connected</span></header>
<main>
<form id="connection"><label for="token-file">Local API token file</label><input id="token-file" type="file"><label for="token">Or enter local access token</label><div class="toolbar"><input id="token" type="password" autocomplete="off" required aria-label="Local access token"><button class="primary">Connect</button></div></form>
<div id="status" role="status" aria-live="polite"></div>
<div id="navigation" hidden><div class="tabs" role="tablist" aria-label="Workflow"><button id="analysis-tab" role="tab" aria-selected="true" aria-controls="analysis-workspace">Page analysis</button><button id="chat-tab" role="tab" aria-selected="false" aria-controls="workspace">Saved-run chat</button></div><button id="signout" type="button">Disconnect</button></div>
<section id="analysis-workspace" role="tabpanel" aria-labelledby="analysis-tab" hidden>
<div class="analysis-section"><h2>Analyse a public page</h2><p id="analysis-budget" class="muted"></p>
<form id="analyse-form"><label for="page-url">Public URL</label><input id="page-url" type="url" required maxlength="2048" placeholder="https://example.com/page"><label for="page-locale">Locale</label><select id="page-locale"><option value="en-GB">English / United Kingdom</option><option value="en-US">English / United States</option></select><label><input id="analysis-consent" type="checkbox" required> Approve 1 indexed Browse + 1 analysis model call</label><button id="analyse" class="primary">Analyse page</button></form>
<button id="recover-analysis" type="button" hidden>Check saved request</button></div>
<div class="analysis-section"><label for="saved-analyses">Saved page analyses</label><select id="saved-analyses"><option value="">Select an analysis</option></select><div class="toolbar"><button id="open-analysis" type="button">Open analysis</button><button id="refresh-analyses" type="button">Refresh reports</button></div></div>
<div id="page-report"></div>
<section id="evaluation-section" class="analysis-section" hidden><h2>Citation evaluation</h2><p id="evaluation-status" class="muted">Not requested</p>
<form id="evaluation-brief"><label for="evaluation-audience">Target audience</label><input id="evaluation-audience" required maxlength="1000"><label for="evaluation-goal">Evaluation goal</label><input id="evaluation-goal" required maxlength="1000" value="Measure exact-page citations for relevant discovery queries"><label><input id="proposal-consent" type="checkbox" required> Approve 1 query-generation call using this saved page</label><button id="propose" class="primary">Propose 5 queries</button></form>
<div id="evaluation-queries"></div><div class="toolbar"><button id="approve-queries" type="button" hidden>Approve these exact queries</button><button id="execute-evaluation" class="primary" type="button" hidden>Run 5 searches + 5 answer calls</button><button id="refresh-evaluation" type="button" hidden>Refresh evaluation</button></div><div id="evaluation-results"></div></section>
</section>
<section id="workspace" hidden>
<div class="toolbar"><input id="conversation" aria-label="Conversation ID" placeholder="Conversation ID"><button id="load" type="button">Open</button><button id="new" type="button">New chat</button><button id="refresh" type="button">Refresh</button><button id="disconnect" type="button">Disconnect</button></div>
<span id="run" class="muted"></span>
<div id="messages" aria-label="Conversation"><div id="empty"><strong>GEO evidence assistant</strong><span class="muted">No messages yet</span></div></div>
<form id="composer"><label for="message" class="speaker">Your message</label><textarea id="message" maxlength="4000" required placeholder="Ask about the saved run" disabled></textarea><div class="compose-actions"><small id="count">0 / 4000</small><button id="send" class="primary" disabled>Send</button></div></form>
</section>
</main>
<script>
(() => {
  const element = id => document.getElementById(id);
  let token = "";
  let current = null;
  let budget = null;
  let busy = false;
  let uncertain = false;
  let analysisBudget = null;
  let selectedAnalysis = null;
  let evaluationRun = null;
  let mode = new URLSearchParams(location.search).get("view") || (new URLSearchParams(location.search).has("conversation") ? "chat" : "analysis");
  let pendingAnalysis = null;
  try { pendingAnalysis = JSON.parse(sessionStorage.getItem("geo-pending-analysis") || "null"); } catch { sessionStorage.removeItem("geo-pending-analysis"); }
  const initialChat = new URLSearchParams(location.search).get("conversation");
  const status = (message, error = false) => { element("status").textContent = message; element("status").className = error ? "error" : ""; };
  function controls() {
    for (const id of ["load", "new", "refresh", "disconnect", "conversation"]) element(id).disabled = busy;
    const blocked = busy || uncertain || !current || !budget || budget.remaining <= 0 || current.turns.length >= 12 || current.turns.some(turn => turn.status === "running");
    element("message").disabled = blocked;
    element("send").disabled = blocked;
    element("send").textContent = busy ? "Working..." : "Send";
    for (const id of ["analysis-tab", "chat-tab", "signout", "open-analysis", "refresh-analyses", "saved-analyses", "recover-analysis", "approve-queries", "execute-evaluation", "refresh-evaluation"]) element(id).disabled = busy;
    element("analyse").disabled = busy || !analysisBudget || analysisBudget.analyses_remaining <= 0 || !!pendingAnalysis;
    element("propose").disabled = busy || !selectedAnalysis || selectedAnalysis.status !== "completed" || !analysisBudget || analysisBudget.evaluations_remaining <= 0;
    element("recover-analysis").hidden = !pendingAnalysis;
    for (const id of ["page-url", "page-locale", "analysis-consent", "evaluation-audience", "evaluation-goal", "proposal-consent"]) element(id).disabled = busy;
  }
  async function api(path, body) {
    const response = await fetch(path, {method: body === undefined ? "GET" : "POST", headers: {"Authorization": "Bearer " + token, "Content-Type": "application/json"}, ...(body === undefined ? {} : {body: JSON.stringify(body)}), cache: "no-store", redirect: "error", credentials: "omit"});
    if (!response.ok) { const error = new Error(`Local request failed (HTTP ${response.status}).`); error.status = response.status; throw error; }
    return response.json();
  }
  async function updateBudget() {
    const result = await api("/chat-policy");
    budget = result.budget;
    element("budget").textContent = `${budget.remaining} / ${budget.limit} model requests remaining`;
    element("run").textContent = "Run " + result.policy.run_id;
  }
  function answerText(target, text) {
    const parts = text.split(/(https?:\/\/[^\s<>"\]]+)/g);
    for (const part of parts) {
      if (/^https?:\/\//.test(part)) {
        const url = part.replace(/[).,;`]+$/, "");
        const link = document.createElement("a");
        link.href = url; link.textContent = url; link.target = "_blank"; link.rel = "noopener noreferrer";
        target.append(link, document.createTextNode(part.slice(url.length)));
      } else target.append(document.createTextNode(part));
    }
  }
  function render() {
    const messages = element("messages");
    messages.replaceChildren();
    element("conversation").value = current.chat_id;
    for (const turn of current.turns) {
      const section = document.createElement("section"); section.className = "turn";
      const user = document.createElement("div"); user.className = "user"; user.textContent = turn.message;
      const label = document.createElement("div"); label.className = "speaker"; label.textContent = "GEO";
      const answer = document.createElement("div"); answer.className = "answer" + (turn.status === "failed" ? " error" : "");
      answerText(answer, turn.answer || turn.error || "Working on this turn. Refresh to check its saved status.");
      const meta = document.createElement("small"); meta.textContent = `${turn.status} / ${(turn.calls || []).length} model requests`;
      section.append(user, label, answer, meta); messages.append(section);
    }
    if (!current.turns.length) { const empty = document.createElement("p"); empty.id = "empty"; empty.textContent = "No messages yet"; messages.append(empty); }
    const url = new URL(location.href); url.searchParams.set("conversation", current.chat_id); history.replaceState(null, "", url);
    controls();
  }
  async function action(work) {
    if (busy) return;
    busy = true; controls(); status("Loading...");
    try { await work(); status(uncertain ? "Message status is uncertain. Refresh this conversation before sending again." : ""); }
    catch (error) { status(error.message + " No automatic retry.", true); }
    finally { busy = false; controls(); }
  }
  async function connect() {
    try { await updateBudget(); } catch (error) { if (error.status !== 503) throw error; element("budget").textContent = "Saved-run chat disabled"; }
    await loadAnalysisBudget();
    element("connection").hidden = true; element("navigation").hidden = false;
    switchMode(mode);
    element("token").value = "";
    if (initialChat) { current = await api("/conversations/" + encodeURIComponent(initialChat)); render(); }
    if (analysisBudget) {
      await listAnalyses();
      const id = new URLSearchParams(location.search).get("analysis");
      if (id) await openAnalysis(id);
    }
  }
  element("connection").addEventListener("submit", event => { event.preventDefault(); token = element("token").value.trim(); action(connect); });
  element("token-file").addEventListener("change", () => action(async () => {
    const file = element("token-file").files[0];
    if (!file) return;
    if (file.size > 4096) throw new Error("Select the local API token file.");
    token = (await file.text()).trim(); element("token-file").value = "";
    try { await connect(); } catch (error) { token = ""; throw error; }
  }));
  element("new").addEventListener("click", () => action(async () => { current = await api("/conversations", {}); uncertain = false; render(); }));
  element("load").addEventListener("click", () => action(async () => { const id = element("conversation").value.trim(); if (!id) throw new Error("Enter a conversation ID."); current = await api("/conversations/" + encodeURIComponent(id)); uncertain = false; await updateBudget(); render(); }));
  element("refresh").addEventListener("click", () => action(async () => { if (current) { current = await api("/conversations/" + encodeURIComponent(current.chat_id)); uncertain = false; render(); } await updateBudget(); }));
  function disconnect() {
    token = ""; current = null; budget = null; selectedAnalysis = null; evaluationRun = null; analysisBudget = null;
    for (const id of ["messages", "page-report", "evaluation-results", "evaluation-queries"]) element(id).replaceChildren();
    for (const id of ["workspace", "analysis-workspace", "navigation"]) element(id).hidden = true;
    element("connection").hidden = false; element("budget").textContent = "Not connected"; status("");
  }
  element("disconnect").addEventListener("click", disconnect);
  element("signout").addEventListener("click", disconnect);
  element("message").addEventListener("input", () => { element("count").textContent = `${element("message").value.length} / 4000`; });
  element("composer").addEventListener("submit", event => {
    event.preventDefault();
    const message = element("message").value.trim();
    if (!message || element("send").disabled) return;
    action(async () => {
      uncertain = true; status("Reading saved evidence...");
      current = await api(`/conversations/${encodeURIComponent(current.chat_id)}/messages`, {message, expected_revision: current.revision, idempotency_key: crypto.randomUUID()});
      uncertain = false; element("message").value = ""; element("count").textContent = "0 / 4000"; render();
      await updateBudget();
      element("composer").scrollIntoView({block: "end"});
    });
  });
  function switchMode(next) {
    mode = next;
    element("workspace").hidden = mode !== "chat";
    element("analysis-workspace").hidden = mode !== "analysis";
    element("chat-tab").setAttribute("aria-selected", String(mode === "chat"));
    element("analysis-tab").setAttribute("aria-selected", String(mode === "analysis"));
    const url = new URL(location.href); url.searchParams.set("view", mode); history.replaceState(null, "", url);
  }
  element("chat-tab").addEventListener("click", () => switchMode("chat"));
  element("analysis-tab").addEventListener("click", () => switchMode("analysis"));
  async function loadAnalysisBudget() {
    try {
      const result = await api("/analysis-policy"); analysisBudget = result.budget;
      element("analysis-budget").textContent = `${analysisBudget.analyses_remaining} page analyses / ${analysisBudget.evaluations_remaining} optional citation evaluations remaining`;
    } catch (error) { if (error.status !== 503) throw error; analysisBudget = null; element("analysis-budget").textContent = "Page analysis is not enabled on this server."; }
  }
  async function listAnalyses() {
    const records = await api("/page-analyses"); const select = element("saved-analyses");
    select.replaceChildren(new Option("Select an analysis", ""));
    for (const record of records) select.add(new Option(`${record.status} / ${record.url}`, record.analysis_id));
    if (selectedAnalysis) select.value = selectedAnalysis.analysis_id;
  }
  function textNode(tag, text, className = "") { const node = document.createElement(tag); node.textContent = text; node.className = className; return node; }
  function evidenceNodes(target, evidence) {
    for (const reference of evidence) {
      const link = document.createElement("a"); link.href = "#passage-" + reference.passage_id; link.textContent = reference.passage_id;
      target.append(link, textNode("blockquote", reference.quote));
    }
  }
  function renderAnalysis() {
    const record = selectedAnalysis; const target = element("page-report"); target.replaceChildren();
    const heading = textNode("section", "", "analysis-section");
    heading.append(textNode("h2", record.snapshot?.title || record.url));
    const source = document.createElement("a"); source.href = record.url; source.textContent = record.url; source.target = "_blank"; source.rel = "noopener noreferrer"; heading.append(source);
    heading.append(textNode("p", `Retrieval: ${record.retrieval_status} / Analysis: ${record.analysis_status}`));
    if (record.error) heading.append(textNode("p", record.error));
    if (record.snapshot) heading.append(textNode("p", `Captured ${record.snapshot.captured_at} / Indexed crawl: ${record.snapshot.crawled_at || "not supplied"}`, "muted"));
    target.append(heading);
    if (record.report) {
      for (const [key, title] of [["purpose", "Purpose"], ["audience", "Audience"], ["entities", "Key entities"], ["questions_answered", "Questions answered"], ["observations", "Observations"], ["improvements", "Improvement hypotheses"]]) {
        const section = textNode("section", "", "analysis-section"); section.append(textNode("h2", title));
        const values = Array.isArray(record.report[key]) ? record.report[key] : [record.report[key]];
        if (!values.length) section.append(textNode("p", "Insufficient evidence in the retrieved excerpt."));
        for (const finding of values) {
          const block = textNode("div", "", "finding");
          block.append(textNode("span", finding.basis || "hypothesis / requires review", "basis"), textNode("p", finding.text || finding.hypothesis));
          if (finding.rationale) block.append(textNode("p", finding.rationale));
          evidenceNodes(block, finding.evidence);
          if (finding.verification) block.append(textNode("p", "Verification: " + finding.verification));
          section.append(block);
        }
        target.append(section);
      }
    }
    const limits = textNode("section", "", "analysis-section limits"); limits.append(textNode("h2", "Scope and limits"));
    for (const limit of record.limits) limits.append(textNode("p", limit)); target.append(limits);
    const passages = document.createElement("details"); passages.className = "analysis-section"; passages.append(textNode("summary", "Retained page evidence"));
    for (const passage of record.passages) { const block = textNode("div", ""); block.id = "passage-" + passage.passage_id; block.append(textNode("h3", passage.passage_id), textNode("blockquote", passage.text)); passages.append(block); }
    target.append(passages);
    element("evaluation-section").hidden = record.status !== "completed";
    element("evaluation-brief").hidden = !!record.evaluation;
    element("evaluation-status").textContent = record.evaluation ? (record.evaluation.error || record.evaluation.status) : "Not requested";
    element("evaluation-queries").replaceChildren(); element("evaluation-results").replaceChildren();
    for (const id of ["approve-queries", "execute-evaluation", "refresh-evaluation"]) element(id).hidden = true;
    const url = new URL(location.href); url.searchParams.set("analysis", record.analysis_id); history.replaceState(null, "", url);
  }
  async function openAnalysis(id) {
    selectedAnalysis = await api("/page-analyses/" + encodeURIComponent(id)); evaluationRun = null; renderAnalysis();
    if (selectedAnalysis.evaluation?.run_id) await refreshEvaluation();
  }
  async function submitAnalysis() {
    status("Retrieving indexed page content and analysing evidence...");
    const record = await api("/page-analyses", pendingAnalysis);
    selectedAnalysis = record; renderAnalysis();
    if (record.status !== "running") { pendingAnalysis = null; sessionStorage.removeItem("geo-pending-analysis"); }
    await loadAnalysisBudget(); await listAnalyses();
  }
  element("analyse-form").addEventListener("submit", event => {
    event.preventDefault(); if (element("analyse").disabled) return;
    pendingAnalysis = {url: element("page-url").value.trim(), locale: element("page-locale").value, idempotency_key: crypto.randomUUID()};
    sessionStorage.setItem("geo-pending-analysis", JSON.stringify(pendingAnalysis));
    action(submitAnalysis);
  });
  element("recover-analysis").addEventListener("click", () => action(submitAnalysis));
  element("open-analysis").addEventListener("click", () => action(async () => { if (!element("saved-analyses").value) throw new Error("Select an analysis."); await openAnalysis(element("saved-analyses").value); }));
  element("refresh-analyses").addEventListener("click", () => action(async () => { await loadAnalysisBudget(); await listAnalyses(); if (selectedAnalysis) await openAnalysis(selectedAnalysis.analysis_id); }));
  element("evaluation-brief").addEventListener("submit", event => {
    event.preventDefault(); if (element("propose").disabled) return;
    action(async () => {
      status("Generating five queries for human review...");
      await api(`/page-analyses/${encodeURIComponent(selectedAnalysis.analysis_id)}/evaluation`, {audience: element("evaluation-audience").value.trim(), goal: element("evaluation-goal").value.trim(), idempotency_key: crypto.randomUUID(), confirm_query_generation: true});
      await openAnalysis(selectedAnalysis.analysis_id); await loadAnalysisBudget();
    });
  });
  async function refreshEvaluation() {
    evaluationRun = await api("/runs/" + encodeURIComponent(selectedAnalysis.evaluation.run_id));
    const run = evaluationRun; element("evaluation-queries").replaceChildren(); element("evaluation-results").replaceChildren();
    element("evaluation-status").textContent = `Run ${run.run_id} / ${run.results.length ? "Evaluation " + (run.results.every(result => result.status === "completed") ? "completed" : run.state) : run.state}`;
    element("evaluation-queries").append(textNode("p", "Audience: " + run.inputs.brief.audience), textNode("p", "Goal: " + run.inputs.brief.goal));
    for (const query of run.inputs.queries) {
      const block = textNode("div", "", "finding"); block.append(textNode("h3", `${query.query_id} / ${query.branded ? "branded" : "unbranded"}`), textNode("p", query.text), textNode("small", query.intent)); element("evaluation-queries").append(block);
    }
    const awaiting = run.state === "awaiting-query-approval";
    element("approve-queries").hidden = !awaiting || !!run.approval;
    element("execute-evaluation").hidden = !awaiting || !run.approval;
    element("refresh-evaluation").hidden = false;
    if (run.scores) element("evaluation-results").append(textNode("h3", "Exact-page citation score: " + (run.scores.overall.score ?? "N/A") + " / 100"));
    for (const result of run.results) {
      const block = textNode("div", "", "finding"); block.append(textNode("h3", result.query_id + " / " + result.status), textNode("p", result.answer || result.error));
      for (const source of result.sources) { const link = document.createElement("a"); link.href = source.url; link.textContent = source.evidence_id + " / " + source.url; link.target = "_blank"; link.rel = "noopener noreferrer"; const detail = document.createElement("details"); detail.append(textNode("summary", source.evidence_id), link, textNode("blockquote", source.excerpt)); block.append(detail); }
      element("evaluation-results").append(block);
    }
  }
  element("refresh-evaluation").addEventListener("click", () => action(refreshEvaluation));
  element("approve-queries").addEventListener("click", () => action(async () => {
    await api(`/runs/${evaluationRun.run_id}/query-approval`, {expected_revision: evaluationRun.revision, input_hash: evaluationRun.approval_hash}); await refreshEvaluation();
  }));
  element("execute-evaluation").addEventListener("click", () => action(async () => {
    status("Running the approved citation evaluation...");
    await api(`/runs/${evaluationRun.run_id}/start`, {expected_revision: evaluationRun.revision, idempotency_key: "browser-" + evaluationRun.approval_hash}); await refreshEvaluation();
  }));
  controls();
})();
</script>
