<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GEO | Measurement Console</title>
<script>
(() => {
  const param = new URLSearchParams(window.location.search).get("scoutTheme");
  const theme = param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  document.documentElement.setAttribute("data-theme", theme);
})();
</script>
<style>
:root {
  color-scheme: light;
  --cp-bg: #f7f4ef;
  --cp-bg-elevated: #fcfbf8;
  --cp-surface: #ffffff;
  --cp-surface-soft: #f5f5f5;
  --cp-border: #dedede;
  --cp-border-strong: #919191;
  --cp-text: #242424;
  --cp-text-muted: #5c5c5c;
  --cp-text-soft: #6f6f6f;
  --cp-accent: #b11f4b;
  --cp-accent-hover: #9a1a41;
  --cp-accent-soft: rgba(177, 31, 75, 0.08);
  --cp-accent-fg: #ffffff;
  --cp-success: #16a34a;
  --cp-danger: #dc2626;
  --cp-warning: #f59e0b;
  --cp-link: #0078d4;
  --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
  --cp-overlay: rgba(255, 255, 255, 0.8);
  --cp-panel: rgba(255, 255, 255, 0.86);
  --cp-panel-strong: rgba(255, 255, 255, 0.96);
  --cp-sheen: rgba(255, 255, 255, 0.55);
  --cp-highlight: rgba(177, 31, 75, 0.12);
}
html[data-theme="dark"] {
  color-scheme: dark;
  --cp-bg: #3d3b3a;
  --cp-bg-elevated: #343231;
  --cp-surface: #292929;
  --cp-surface-soft: #2e2e2e;
  --cp-border: #474747;
  --cp-border-strong: #5f5f5f;
  --cp-text: #dedede;
  --cp-text-muted: #919191;
  --cp-text-soft: #b0b0b0;
  --cp-accent: #fd8ea1;
  --cp-accent-hover: #fb7b91;
  --cp-accent-soft: rgba(253, 142, 161, 0.14);
  --cp-accent-fg: #1a1a1a;
  --cp-success: #4ade80;
  --cp-danger: #f87171;
  --cp-warning: #fbbf24;
  --cp-link: #4da6ff;
  --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
  --cp-overlay: rgba(41, 41, 41, 0.88);
  --cp-panel: rgba(41, 41, 41, 0.72);
  --cp-panel-strong: rgba(41, 41, 41, 0.96);
  --cp-sheen: rgba(255, 255, 255, 0.04);
  --cp-highlight: rgba(253, 142, 161, 0.12);
}
* { box-sizing: border-box; letter-spacing: 0; }
body { margin: 0; min-width: 280px; background: var(--cp-bg); color: var(--cp-text); font: 15px/1.5 "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif; }
a { color: var(--cp-link); }
button, input, select, textarea { font: inherit; color: var(--cp-text); }
button, input, select, textarea { border: 1px solid var(--cp-border-strong); border-radius: 8px; background: var(--cp-surface); padding: 10px 12px; }
button { cursor: pointer; white-space: nowrap; }
button:hover { background: var(--cp-surface-soft); }
button:disabled { cursor: default; opacity: .5; }
button.primary { color: var(--cp-accent-fg); background: var(--cp-accent); border-color: var(--cp-accent); }
button.primary:hover { background: var(--cp-accent-hover); }
button.danger { color: var(--cp-danger); border-color: var(--cp-danger); }
:focus-visible { outline: 2px solid var(--cp-link); outline-offset: 3px; }
[hidden] { display: none !important; }
header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 24px; background: var(--cp-surface); border-bottom: 1px solid var(--cp-border); }
.brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
.mark { display: grid; width: 44px; height: 44px; place-items: center; color: var(--cp-accent); border: 2px solid var(--cp-accent); border-radius: 50%; font-weight: 800; }
h1, h2, h3, p { margin-top: 0; }
h1 { margin-bottom: 0; font-size: 19px; font-weight: 650; }
h2 { margin-bottom: 12px; font-size: 20px; }
h3 { margin-bottom: 8px; font-size: 15px; }
.muted, small { color: var(--cp-text-muted); }
.header-actions, .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.header-actions a { white-space: nowrap; }
.mode { padding: 4px 8px; border: 1px solid var(--cp-border); border-radius: 4px; color: var(--cp-text-muted); font-size: 12px; text-transform: uppercase; }
main { max-width: 1320px; margin: 0 auto; padding: 24px; }
#connection { max-width: 680px; padding: 28px 0; border-bottom: 1px solid var(--cp-border); }
#connection label, .field label { display: block; margin: 0 0 6px; font-weight: 600; }
#connection input[type="password"] { flex: 1 1 280px; min-width: 0; }
#connection input[type="file"] { display: block; width: 100%; margin-bottom: 16px; }
#status { min-height: 28px; margin: 8px 0; color: var(--cp-text-muted); overflow-wrap: anywhere; }
#status.error { color: var(--cp-danger); }
.brief-band { padding: 20px 0 24px; border-bottom: 1px solid var(--cp-border); }
.form-grid { display: grid; grid-template-columns: minmax(220px, 1.4fr) minmax(180px, 1fr) minmax(180px, 1fr) 120px auto; gap: 12px; align-items: end; }
.field input, .field select { width: 100%; min-width: 0; }
.workspace-grid { display: grid; grid-template-columns: minmax(220px, 290px) minmax(0, 1fr); min-height: 580px; }
.run-sidebar { padding: 24px 20px 24px 0; border-right: 1px solid var(--cp-border); }
.run-sidebar .toolbar { margin-bottom: 12px; }
.run-list { display: grid; gap: 4px; }
.run-list button { width: 100%; min-height: 64px; padding: 10px; border: 0; border-left: 3px solid transparent; border-radius: 0; text-align: left; white-space: normal; }
.run-list button[aria-current="true"] { border-left-color: var(--cp-accent); background: var(--cp-accent-soft); }
.run-list strong, .run-list span { display: block; overflow-wrap: anywhere; }
.run-list span { color: var(--cp-text-muted); font-size: 12px; }
.run-detail { min-width: 0; padding: 24px 0 48px 28px; }
.empty { padding: 80px 24px; color: var(--cp-text-muted); text-align: center; }
.run-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
.run-heading a { overflow-wrap: anywhere; }
.run-heading small { display: block; margin-top: 4px; }
.state { flex: none; padding: 4px 8px; border: 1px solid var(--cp-border-strong); border-radius: 4px; font-size: 12px; font-weight: 700; text-transform: uppercase; }
.state.ready, .state.exported { color: var(--cp-success); border-color: var(--cp-success); }
.state.partial, .state.needs-review { color: var(--cp-warning); border-color: var(--cp-warning); }
.state.failed, .state.cancelled { color: var(--cp-danger); border-color: var(--cp-danger); }
.progress { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 22px 0; margin: 20px 0 4px; border-top: 1px solid var(--cp-border); border-bottom: 1px solid var(--cp-border); list-style: none; }
.progress li { position: relative; padding-top: 24px; color: var(--cp-text-muted); text-align: center; font-size: 12px; }
.progress li::before { position: absolute; top: 0; left: 50%; width: 14px; height: 14px; border: 2px solid var(--cp-border-strong); border-radius: 50%; background: var(--cp-bg); content: ""; transform: translateX(-50%); }
.progress li:not(:last-child)::after { position: absolute; top: 7px; left: calc(50% + 9px); width: calc(100% - 18px); height: 2px; background: var(--cp-border); content: ""; }
.progress li.done { color: var(--cp-text); font-weight: 600; }
.progress li.done::before, .progress li.done::after { border-color: var(--cp-accent); background: var(--cp-accent); }
.run-section { padding: 20px 0; border-bottom: 1px solid var(--cp-border); overflow-wrap: anywhere; }
.run-section:last-child { border-bottom: 0; }
.action-strip { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px; background: var(--cp-accent-soft); border-left: 3px solid var(--cp-accent); }
.action-strip label { display: flex; align-items: flex-start; gap: 8px; }
input[type="checkbox"] { width: 18px; height: 18px; flex: none; accent-color: var(--cp-accent); }
.query-list, .result-list { display: grid; gap: 0; }
.query, .result { padding: 16px 0; border-top: 1px solid var(--cp-border); }
.query:first-child, .result:first-child { border-top: 0; }
.recommendation { padding: 18px 0; border-top: 1px solid var(--cp-border); }
.recommendation:first-child { border-top: 0; }
.recommendation h3 { margin-bottom: 6px; }
.recommendation-decision { display: flex; gap: 8px; margin-top: 14px; padding: 0; border: 0; }
.recommendation-decision legend { margin-bottom: 7px; font-size: 12px; font-weight: 700; }
.recommendation-decision label { display: flex; align-items: center; gap: 6px; min-height: 38px; padding: 8px 12px; border: 1px solid var(--cp-border-strong); border-radius: 6px; cursor: pointer; }
.recommendation-decision input { accent-color: var(--cp-accent); }
.evidence-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.evidence-columns h4 { margin-bottom: 5px; }
.query-meta { color: var(--cp-accent); font-size: 12px; font-weight: 700; text-transform: uppercase; }
.query p, .result p { margin-bottom: 8px; }
.query-editor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
.query-editor-grid .field-wide { grid-column: 1 / -1; }
.query-editor-grid label { display: block; margin-bottom: 5px; font-size: 12px; font-weight: 700; }
.query-editor-grid textarea { width: 100%; min-height: 76px; resize: vertical; }
.query-editor-grid .branded-field { display: flex; align-items: center; gap: 8px; }
.grounding { font-family: Consolas, "Courier New", Courier, monospace; color: var(--cp-text-muted); font-size: 13px; }
.metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--cp-border); border: 1px solid var(--cp-border); }
.metric { min-height: 88px; padding: 14px; background: var(--cp-surface); }
.metric strong { display: block; font-size: 24px; font-weight: 650; }
.metric span { color: var(--cp-text-muted); font-size: 12px; }
.provenance-band { margin-bottom: 14px; padding: 14px 16px; border-left: 3px solid var(--cp-warning); background: var(--cp-warning-soft); }
.provenance-band strong { display: block; margin-bottom: 4px; }
.provenance-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--cp-border); border: 1px solid var(--cp-border); }
.provenance-grid div { min-height: 72px; padding: 12px; background: var(--cp-surface); }
.provenance-grid strong, .provenance-grid span { display: block; }
.provenance-grid span { color: var(--cp-text-muted); font-size: 12px; }
details { margin: 8px 0; }
summary { cursor: pointer; font-weight: 600; }
blockquote { margin: 8px 0; padding: 8px 12px; border-left: 3px solid var(--cp-border-strong); color: var(--cp-text-muted); white-space: pre-wrap; }
.event-list { margin: 0; padding-left: 22px; }
.event-list li { padding: 3px 0; }
dialog { width: min(640px, calc(100% - 32px)); padding: 0; color: var(--cp-text); background: var(--cp-surface); border: 1px solid var(--cp-border-strong); border-radius: 8px; box-shadow: var(--cp-shadow); }
dialog::backdrop { background: var(--cp-overlay); }
.dialog-body { padding: 20px; overflow-wrap: anywhere; }
.dialog-actions { display: flex; justify-content: flex-end; padding: 12px 20px; border-top: 1px solid var(--cp-border); }
@media (max-width: 980px) {
  .form-grid { grid-template-columns: 1fr 1fr; }
  .form-grid .url-field { grid-column: 1 / -1; }
  .workspace-grid { grid-template-columns: 220px minmax(0, 1fr); }
  .metrics, .provenance-grid { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 680px) {
  header { align-items: flex-start; padding: 14px 16px; }
  .header-actions { justify-content: flex-end; }
  main { padding: 16px; }
  .form-grid, .workspace-grid { display: block; }
  .form-grid .field, .form-grid button { margin-bottom: 12px; }
  .run-sidebar { padding: 20px 0; border-right: 0; border-bottom: 1px solid var(--cp-border); }
  .run-detail { padding: 24px 0 40px; }
  .run-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .action-strip, .run-heading { align-items: stretch; flex-direction: column; }
  .action-strip button { width: 100%; }
  .query-editor-grid { grid-template-columns: 1fr; }
  .query-editor-grid .field-wide { grid-column: auto; }
  .evidence-columns { grid-template-columns: 1fr; }
  .recommendation-decision { flex-direction: column; }
  .progress { overflow-x: auto; grid-template-columns: repeat(5, minmax(72px, 1fr)); }
}
@media (max-width: 420px) {
  .header-actions { width: 100%; justify-content: space-between; }
  .run-list, .metrics, .provenance-grid { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: no-preference) {
  .run-detail > * { animation: appear .18s ease-out; }
  @keyframes appear { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="mark" aria-hidden="true">G</span><div><h1>GEO Measurement Console</h1><small>Approval-gated workspace</small></div></div>
  <div class="header-actions"><span id="policy-mode" class="mode">Not connected</span><a href="/chat?view=analysis">Evidence chat</a><select id="theme" aria-label="Color theme"><option value="auto">Auto</option><option value="light">Light</option><option value="dark">Dark</option></select><button id="disconnect" type="button" hidden>Disconnect</button></div>
</header>
<main>
  <form id="connection">
    <h2>Connect</h2>
    <label for="token-file">Local API token file</label><input id="token-file" type="file">
    <label for="token">Or enter local access token</label><div class="toolbar"><input id="token" type="password" autocomplete="off" required aria-label="Local access token"><button class="primary">Connect</button></div>
  </form>
  <div id="status" role="status" aria-live="polite"></div>
  <div id="app" hidden>
    <section class="brief-band" aria-labelledby="new-run-heading">
      <h2 id="new-run-heading">New measurement</h2>
      <form id="brief-form" class="form-grid">
        <div class="field url-field"><label for="brief-url">Public URL</label><input id="brief-url" type="url" required maxlength="2048" value="https://example.com/mock-page"><small id="brief-policy">Allowed hosts load after connection.</small></div>
        <div class="field"><label for="brief-audience">Audience</label><input id="brief-audience" required maxlength="1000" value="Research buyers"></div>
        <div class="field"><label for="brief-goal">Goal</label><input id="brief-goal" required maxlength="1000" value="Compare trusted options"></div>
        <div class="field"><label for="brief-locale">Locale</label><select id="brief-locale"></select></div>
        <button class="primary" type="submit">Create</button>
      </form>
    </section>
    <div class="workspace-grid">
      <aside class="run-sidebar" aria-labelledby="runs-heading"><div class="toolbar"><h2 id="runs-heading">Runs</h2><button id="refresh-runs" type="button">Refresh</button></div><div id="run-list" class="run-list"></div></aside>
      <article id="run-detail" class="run-detail"><div class="empty">Select a run or create a new measurement.</div></article>
    </div>
  </div>
</main>
<dialog id="evidence-dialog" aria-labelledby="evidence-heading"><div id="evidence-body" class="dialog-body"></div><div class="dialog-actions"><button id="close-evidence" type="button">Close</button></div></dialog>
<script>
(() => {
  const element = id => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const activeStates = new Set(["preparing", "queued", "evaluating", "recommending"]);
  let token = "";
  let policy = null;
  let runs = [];
  let current = null;
  let jobs = [];
  let artifact = null;
  let busy = false;
  let editingQueries = false;
  let pollVersion = 0;

  const status = (message, error = false) => {
    element("status").textContent = message;
    element("status").className = error ? "error" : "";
  };
  const textNode = (tag, text, className = "") => {
    const node = document.createElement(tag);
    node.textContent = text;
    node.className = className;
    return node;
  };
  const buttonNode = (label, id, className = "") => {
    const button = textNode("button", label, className);
    button.type = "button";
    button.id = id;
    return button;
  };
  const delay = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));

  function setControls() {
    for (const control of document.querySelectorAll("#app button, #app input, #app select, #app textarea")) control.disabled = busy;
    element("disconnect").disabled = busy;
  }

  async function request(path, {method = "GET", body} = {}) {
    const headers = {"Authorization": "Bearer " + token};
    if (body !== undefined) headers["Content-Type"] = "application/json";
    const response = await fetch(path, {
      method,
      headers,
      ...(body === undefined ? {} : {body: JSON.stringify(body)}),
      cache: "no-store",
      redirect: "error",
      credentials: "omit",
    });
    if (!response.ok) {
      let detail = `Local request failed (HTTP ${response.status}).`;
      try { detail = (await response.json()).detail || detail; } catch {}
      const error = new Error(detail); error.status = response.status; throw error;
    }
    return response;
  }
  async function api(path, options) { return (await request(path, options)).json(); }

  async function action(work) {
    if (busy) return;
    busy = true; setControls(); status("Working...");
    try { await work(); status(""); }
    catch (error) { status(error.message + " No automatic retry.", true); }
    finally { busy = false; setControls(); }
  }

  function stateLabel(value) { return value.replaceAll("-", " "); }
  function stageCount(run) {
    if (run.state === "exported") return 5;
    if (["ready", "partial", "failed"].includes(run.state)) return 4;
    if (["queued", "evaluating", "recommending"].includes(run.state)) return 3;
    if (run.approval) return 3;
    if (run.state === "awaiting-query-approval") return 2;
    if (run.state === "preparing") return 1;
    return 0;
  }

  function renderPolicy() {
    element("policy-mode").textContent = `${policy.execution_mode} / ${policy.profiles.length} profiles`;
    element("brief-policy").textContent = `Allowed ${policy.allowed_domains.length === 1 ? "host" : "hosts"}: ${policy.allowed_domains.join(", ")}`;
    const locale = element("brief-locale"); locale.replaceChildren(new Option(policy.locale, policy.locale));
  }

  function renderRuns() {
    const list = element("run-list"); list.replaceChildren();
    if (!runs.length) { list.append(textNode("p", "No measurement runs.", "muted")); return; }
    for (const run of runs) {
      const button = document.createElement("button"); button.type = "button";
      button.setAttribute("aria-current", String(current?.run_id === run.run_id));
      button.append(textNode("strong", stateLabel(run.state)), textNode("span", run.brief?.url || run.run_id));
      button.addEventListener("click", () => action(() => openRun(run.run_id)));
      list.append(button);
    }
  }

  function renderProgress(target, run) {
    const progress = document.createElement("ol"); progress.className = "progress"; progress.setAttribute("aria-label", "Measurement progress");
    const completed = stageCount(run);
    for (const [index, label] of ["Brief", "Prepare", "Approve", "Measure", "Export"].entries()) {
      const item = textNode("li", label, index < completed ? "done" : "");
      if (index === completed) item.setAttribute("aria-current", "step");
      progress.append(item);
    }
    target.append(progress);
  }

  function appendAction(target, label, buttonLabel, buttonId, checkboxId = null) {
    const strip = document.createElement("div"); strip.className = "action-strip";
    if (checkboxId) {
      const wrapper = document.createElement("label");
      const checkbox = document.createElement("input"); checkbox.type = "checkbox"; checkbox.id = checkboxId;
      wrapper.append(checkbox, document.createTextNode(label)); strip.append(wrapper);
    } else strip.append(textNode("span", label));
    strip.append(buttonNode(buttonLabel, buttonId, "primary")); target.append(strip);
  }

  function renderQueries(target, run) {
    if (!run.inputs) return;
    const section = document.createElement("section"); section.className = "run-section"; section.append(textNode("h2", run.approval ? "Approved query packet" : "Query packet"));
    const list = document.createElement("div"); list.className = "query-list";
    for (const query of run.inputs.query_plan.queries) {
      const block = document.createElement("div"); block.className = "query"; block.dataset.queryId = query.query_id;
      block.append(textNode("span", `${query.query_id} / priority ${query.priority}`, "query-meta"));
      if (editingQueries) {
        const grid = document.createElement("div"); grid.className = "query-editor-grid";
        const editor = (label, field, value, wide = false) => {
          const wrapper = document.createElement("div"); wrapper.className = wide ? "field field-wide" : "field";
          const input = document.createElement("textarea"); input.value = value; input.maxLength = 500; input.required = true; input.dataset.field = field; input.setAttribute("aria-label", `${query.query_id} ${label}`);
          wrapper.append(textNode("label", label), input); return wrapper;
        };
        grid.append(
          editor("Chat query", "chat_query", query.chat_query, true),
          editor("Grounding query", "grounding_query", query.grounding_query, true),
          editor("Intent", "intent", query.intent),
          editor("Rationale", "rationale", query.rationale),
        );
        const branded = document.createElement("label"); branded.className = "branded-field";
        const brandedBox = document.createElement("input"); brandedBox.type = "checkbox"; brandedBox.checked = query.branded; brandedBox.dataset.field = "branded"; brandedBox.setAttribute("aria-label", `${query.query_id} Branded query`);
        branded.append(brandedBox, document.createTextNode("Branded query")); grid.append(branded); block.append(grid);
      } else {
        block.append(textNode("h3", query.chat_query), textNode("p", query.rationale), textNode("p", query.grounding_query, "grounding"));
      }
      const evidence = document.createElement("details"); evidence.append(textNode("summary", "Page basis"));
      for (const quote of query.evidence) evidence.append(textNode("blockquote", `${quote.evidence_id}: ${quote.quote}`));
      block.append(evidence); list.append(block);
    }
    section.append(list); target.append(section);
  }

  function renderMetrics(target, run) {
    if (!run.scores) return;
    const overall = run.scores.overall;
    const retrieval = run.scores.retrieval;
    const section = document.createElement("section"); section.className = "run-section"; section.append(textNode("h2", "Measurement"));
    const metrics = document.createElement("div"); metrics.className = "metrics";
    for (const [value, label] of [
      [overall.score ?? "N/A", "Exact-page score"],
      [`${overall.numerator}/${overall.denominator}`, "Cited answers"],
      [`${Math.round(retrieval.coverage * 100)}%`, "Retrieval coverage"],
      [run.measurement.results.filter(result => result.status === "error").length, "Errors"],
    ]) {
      const metric = document.createElement("div"); metric.className = "metric"; metric.append(textNode("strong", String(value)), textNode("span", label)); metrics.append(metric);
    }
    section.append(metrics); target.append(section);
  }

  function renderProvenance(target, run) {
    if (!run.measurement) return;
    const measurement = run.measurement;
    const provenance = measurement.inputs.snapshot.provenance;
    const description = provenance === "live"
      ? "Live bounded capture. The score reflects this saved point-in-time evidence packet and simulated profile responses, not actual consumer-product ranking or causal impact."
      : provenance === "recorded"
        ? "Recorded replay. The score uses saved evidence and simulated answers, not current live retrieval or public product performance."
        : "Controlled simulation. The page, retrieval packets, answers, and score are test data; they do not measure public product performance.";
    const section = document.createElement("section"); section.className = "run-section"; section.append(textNode("h2", "Provenance and limits"));
    const band = document.createElement("div"); band.className = "provenance-band"; band.append(textNode("strong", `${provenance} evidence`), textNode("span", description)); section.append(band);
    const grid = document.createElement("div"); grid.className = "provenance-grid";
    for (const [value, label] of [
      [measurement.inputs.snapshot.captured_at || "Timestamp unavailable", "Page snapshot"],
      [`${measurement.retrievals.length} saved packets`, `${provenance} retrieval`],
      [`${measurement.results.length} simulated answers`, `${provenance} evidence packet`],
    ]) {
      const item = document.createElement("div"); item.append(textNode("strong", value), textNode("span", label)); grid.append(item);
    }
    section.append(grid);
    const packets = document.createElement("details"); packets.append(textNode("summary", "Inspect retrieval packet provenance"));
    for (const packet of measurement.retrievals) packets.append(textNode("p", `${packet.query_id} / ${packet.status} / ${packet.provenance} / ${packet.sources.length} saved sources${packet.retrieved_at ? ` / ${packet.retrieved_at}` : ""}`));
    section.append(packets); target.append(section);
  }

  function renderResults(target, run) {
    if (!run.measurement) return;
    const section = document.createElement("section"); section.className = "run-section"; section.append(textNode("h2", "Simulated answers and evidence"));
    const list = document.createElement("div"); list.className = "result-list";
    for (const result of run.measurement.results) {
      const block = document.createElement("div"); block.className = "result";
      block.append(textNode("span", `${result.query_id} / ${result.profile_id} / ${result.status} / ${result.provenance} evidence`, "query-meta"), textNode("p", result.answer || result.error));
      for (const source of result.sources) {
        const detail = document.createElement("details"); detail.append(textNode("summary", `${source.evidence_id} / ${source.title || "Source"}`));
        const sourceLink = document.createElement("a"); sourceLink.href = source.url; sourceLink.target = "_blank"; sourceLink.rel = "noopener noreferrer"; sourceLink.textContent = source.url;
        const inspect = buttonNode("Inspect saved evidence", ""); inspect.dataset.evidenceId = source.evidence_id; inspect.addEventListener("click", () => action(() => inspectEvidence(source.evidence_id)));
        detail.append(sourceLink, textNode("blockquote", source.excerpt), inspect); block.append(detail);
      }
      list.append(block);
    }
    section.append(list); target.append(section);
  }

  function renderRecommendations(target, run) {
    if (!run.recommendations) return;
    const report = run.recommendations;
    const provenance = run.measurement?.inputs.snapshot.provenance || "unknown";
    const section = document.createElement("section"); section.className = "run-section"; section.append(textNode("h2", "Draft recommendation hypotheses"), textNode("p", `Generated from ${provenance} saved evidence. Priority and confidence are hypotheses, not measured impact.`, "query-meta"));
    section.append(textNode("p", report.limitations, "muted"));
    if (!report.tasks.length) {
      section.append(textNode("p", report.reason || "The saved evidence did not support a draft recommendation."));
      target.append(section); return;
    }
    const savedDecisions = new Map((run.recommendation_review?.decisions || []).map(item => [item.task_id, item.decision]));
    for (const task of report.tasks) {
      const block = document.createElement("article"); block.className = "recommendation"; block.dataset.recommendationId = task.task_id;
      block.append(
        textNode("span", `${task.task_id} / priority ${task.priority} / ${task.confidence} confidence`, "query-meta"),
        textNode("h3", task.title),
        textNode("p", task.proposed_change),
        textNode("p", `Target: ${task.target_section}. Verification: ${task.verification}`, "muted"),
      );
      const evidence = document.createElement("details"); evidence.append(textNode("summary", "Evidence and rationale"), textNode("p", task.rationale));
      const columns = document.createElement("div"); columns.className = "evidence-columns";
      for (const [heading, references] of [["Page evidence", task.page_evidence], ["Comparison evidence", task.comparison_evidence]]) {
        const group = document.createElement("div"); group.append(textNode("h4", heading));
        for (const reference of references) group.append(textNode("blockquote", `${reference.evidence_id}: ${reference.quote}`));
        columns.append(group);
      }
      evidence.append(columns); block.append(evidence);
      const fieldset = document.createElement("fieldset"); fieldset.className = "recommendation-decision"; fieldset.append(textNode("legend", "Human decision"));
      for (const [value, label] of [["accepted", "Accept for planning"], ["rejected", "Reject"]]) {
        const option = document.createElement("label");
        const radio = document.createElement("input"); radio.type = "radio"; radio.name = `recommendation-${task.task_id}`; radio.value = value;
        radio.checked = savedDecisions.get(task.task_id) === value; radio.disabled = Boolean(run.recommendation_review);
        option.append(radio, document.createTextNode(label)); fieldset.append(option);
      }
      block.append(fieldset); section.append(block);
    }
    section.append(textNode("p", run.recommendation_review
      ? "Review saved. Accepted tasks are planning inputs only; no editing or publishing permission was granted."
      : "Choose one decision for every task. Acceptance creates a planning file in the export and never grants publishing permission.", "muted"));
    target.append(section);
  }

  function bindActions(run) {
    element("prepare-run")?.addEventListener("click", () => action(async () => {
      if (!element("prepare-confirm").checked) throw new Error("Confirm the bounded preparation calls.");
      const response = await api(`/api/v2/runs/${encodeURIComponent(run.run_id)}/prepare`, {method: "POST", body: {expected_revision: run.revision, idempotency_key: `prepare-${run.run_id}`, confirm_preparation_calls: true}});
      current = response.run; jobs = [response.job, ...jobs]; renderRun(); await pollRun();
    }));
    element("approve-run")?.addEventListener("click", () => action(async () => {
      current = await api(`/api/v2/runs/${encodeURIComponent(run.run_id)}/query-approval`, {method: "POST", body: {expected_revision: run.revision, input_hash: run.approval_hash}});
      renderRun(); await loadRuns();
    }));
    element("edit-queries")?.addEventListener("click", () => { editingQueries = true; renderRun(); });
    element("cancel-query-edit")?.addEventListener("click", () => { editingQueries = false; renderRun(); });
    element("save-queries")?.addEventListener("click", () => action(async () => {
      const queries = run.inputs.query_plan.queries.map(query => {
        const block = document.querySelector(`[data-query-id="${query.query_id}"]`);
        const value = field => block.querySelector(`[data-field="${field}"]`).value.trim();
        const updated = {
          ...query,
          chat_query: value("chat_query"),
          grounding_query: value("grounding_query"),
          intent: value("intent"),
          rationale: value("rationale"),
          branded: block.querySelector('[data-field="branded"]').checked,
        };
        if (![updated.chat_query, updated.grounding_query, updated.intent, updated.rationale].every(Boolean)) throw new Error(`Complete every field for ${query.query_id}.`);
        return updated;
      });
      current = await api(`/api/v2/runs/${encodeURIComponent(run.run_id)}/queries`, {method: "PUT", body: {expected_revision: run.revision, queries}});
      editingQueries = false; renderRun(); await loadRuns();
    }));
    element("evaluate-run")?.addEventListener("click", () => action(async () => {
      if (!element("evaluate-confirm").checked) throw new Error("Confirm the bounded measurement calls.");
      const response = await api(`/api/v2/runs/${encodeURIComponent(run.run_id)}/start`, {method: "POST", body: {expected_revision: run.revision, idempotency_key: `evaluate-${run.run_id}`, confirm_evaluation_calls: true, include_recommendations: element("include-recommendations").checked}});
      current = response.run; jobs = [response.job, ...jobs]; renderRun(); await pollRun();
    }));
    element("review-recommendations")?.addEventListener("click", () => action(async () => {
      const decisions = run.recommendations.tasks.map(task => {
        const selected = document.querySelector(`input[name="recommendation-${task.task_id}"]:checked`);
        if (!selected) throw new Error(`Choose a decision for ${task.task_id}.`);
        return {task_id: task.task_id, decision: selected.value};
      });
      current = await api(`/api/v2/runs/${encodeURIComponent(run.run_id)}/recommendation-review`, {method: "POST", body: {expected_revision: run.revision, decisions}});
      renderRun(); await loadRuns();
    }));
    element("cancel-job")?.addEventListener("click", () => action(async () => {
      const job = jobs.find(item => ["queued", "leased"].includes(item.state));
      if (!job) throw new Error("No active job is available to cancel.");
      const response = await api(`/api/v2/jobs/${encodeURIComponent(job.job_id)}/cancel`, {method: "POST", body: {}});
      current = response.run; jobs = jobs.map(item => item.job_id === response.job.job_id ? response.job : item); renderRun(); await loadRuns();
    }));
    element("export-run")?.addEventListener("click", () => action(async () => {
      const response = await api(`/api/v2/runs/${encodeURIComponent(run.run_id)}/exports`, {method: "POST", body: {expected_revision: run.revision}});
      current = response.run; artifact = response.artifact; renderRun(); await loadRuns();
    }));
    element("download-artifact")?.addEventListener("click", () => action(downloadArtifact));
    element("refresh-run")?.addEventListener("click", () => action(() => openRun(run.run_id)));
  }

  function renderRun() {
    const target = element("run-detail"); target.replaceChildren();
    if (!current) { target.append(textNode("div", "Select a run or create a new measurement.", "empty")); renderRuns(); return; }
    const heading = document.createElement("div"); heading.className = "run-heading";
    const title = document.createElement("div"); title.append(textNode("h2", current.brief?.goal || "Measurement run"));
    const source = document.createElement("a"); source.href = current.brief?.url || "#"; source.target = "_blank"; source.rel = "noopener noreferrer"; source.textContent = current.brief?.url || current.run_id; title.append(source, textNode("small", `Run ${current.run_id} / revision ${current.revision}`));
    heading.append(title, textNode("span", stateLabel(current.state), `state ${current.state}`)); target.append(heading); renderProgress(target, current);

    const controls = document.createElement("section"); controls.className = "run-section";
    if (current.state === "draft") {
      appendAction(controls, `Confirm ${policy.limits.preparation_calls} synthetic preparation calls`, "Prepare query packet", "prepare-run", "prepare-confirm");
    } else if (activeStates.has(current.state)) {
      const strip = document.createElement("div"); strip.className = "action-strip"; strip.append(textNode("span", "Durable worker job in progress"), buttonNode("Refresh", "refresh-run"));
      if (jobs.some(job => ["queued", "leased"].includes(job.state))) strip.append(buttonNode("Cancel job", "cancel-job", "danger")); controls.append(strip);
    } else if (current.state === "awaiting-query-approval" && !current.approval) {
      const strip = document.createElement("div"); strip.className = "action-strip";
      strip.append(textNode("span", editingQueries ? "Update all five query pairs before approval" : "The five query pairs below are the exact measurement input"));
      const actions = document.createElement("div"); actions.className = "toolbar";
      if (editingQueries) actions.append(buttonNode("Cancel", "cancel-query-edit"), buttonNode("Save query packet", "save-queries", "primary"));
      else actions.append(buttonNode("Edit query packet", "edit-queries"), buttonNode("Approve exact queries", "approve-run", "primary"));
      strip.append(actions); controls.append(strip);
    } else if (current.state === "awaiting-query-approval" && current.approval) {
      const strip = document.createElement("div"); strip.className = "action-strip";
      const options = document.createElement("div");
      const confirm = document.createElement("label"); const confirmBox = document.createElement("input"); confirmBox.type = "checkbox"; confirmBox.id = "evaluate-confirm"; confirm.append(confirmBox, document.createTextNode(`Confirm ${policy.limits.search_calls} searches + ${policy.limits.evaluator_calls} synthetic evaluations`));
      const recommendation = document.createElement("label"); const recommendationBox = document.createElement("input"); recommendationBox.type = "checkbox"; recommendationBox.id = "include-recommendations"; recommendation.append(recommendationBox, document.createTextNode("Include one recommendation pass"));
      options.append(confirm, recommendation); strip.append(options, buttonNode("Start measurement", "evaluate-run", "primary")); controls.append(strip);
    } else if (["ready", "partial", "failed"].includes(current.state)) {
      if (current.recommendations?.tasks.length && !current.recommendation_review) {
        appendAction(controls, "Decide every draft task before creating planning files", "Save recommendation review", "review-recommendations");
      } else {
        appendAction(controls, "Freeze the saved measurement and recommendation report", "Create ZIP export", "export-run");
      }
    } else if (current.state === "exported" && artifact) {
      appendAction(controls, `${Math.ceil(artifact.size / 1024)} KB / SHA-256 ${artifact.content_hash.slice(0, 12)}...`, "Download ZIP", "download-artifact");
    }
    if (controls.childNodes.length) target.append(controls);
    renderQueries(target, current); renderProvenance(target, current); renderMetrics(target, current); renderRecommendations(target, current); renderResults(target, current);
    const events = document.createElement("details"); events.className = "run-section"; events.append(textNode("summary", "Audit events"));
    const list = document.createElement("ol"); list.className = "event-list";
    for (const event of current.events) list.append(textNode("li", `${event.event_type} / ${event.occurred_at}`)); events.append(list); target.append(events);
    bindActions(current); renderRuns(); setControls();
  }

  async function loadRuns() {
    runs = await api("/api/v2/runs"); renderRuns();
  }
  async function openRun(runId) {
    pollVersion++;
    editingQueries = false;
    current = await api(`/api/v2/runs/${encodeURIComponent(runId)}`);
    jobs = await api(`/api/v2/runs/${encodeURIComponent(runId)}/jobs`);
    artifact = null;
    if (current.state === "exported") {
      const artifacts = await api(`/api/v2/runs/${encodeURIComponent(runId)}/artifacts`);
      artifact = artifacts[0] || null;
    }
    sessionStorage.setItem("geo-measurement-run", runId);
    const url = new URL(location.href); url.searchParams.set("run", runId); history.replaceState(null, "", url);
    renderRun();
  }
  async function pollRun() {
    const version = ++pollVersion;
    for (let attempt = 0; attempt < 40 && current && activeStates.has(current.state); attempt++) {
      await delay(250);
      if (version !== pollVersion) return;
      current = await api(`/api/v2/runs/${encodeURIComponent(current.run_id)}`);
      renderRun();
    }
    await loadRuns();
  }
  async function inspectEvidence(evidenceId) {
    const evidence = await api(`/api/v2/runs/${encodeURIComponent(current.run_id)}/evidence/${encodeURIComponent(evidenceId)}`);
    const body = element("evidence-body"); body.replaceChildren(textNode("h2", evidence.title || evidence.evidence_id));
    const link = document.createElement("a"); link.href = evidence.url; link.target = "_blank"; link.rel = "noopener noreferrer"; link.textContent = evidence.url;
    body.append(link, textNode("blockquote", evidence.excerpt), textNode("p", `Provenance: ${evidence.provenance} / returned position: ${evidence.returned_position ?? "not supplied"}`, "muted"));
    element("evidence-dialog").showModal();
  }
  async function downloadArtifact() {
    if (!current || !artifact) throw new Error("No exported artifact is available.");
    const response = await request(`/api/v2/runs/${encodeURIComponent(current.run_id)}/artifacts/${encodeURIComponent(artifact.artifact_id)}`);
    const url = URL.createObjectURL(await response.blob());
    const link = document.createElement("a"); link.href = url; link.download = `geo-${current.run_id}.zip`; document.body.append(link); link.click(); link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 0);
  }

  async function connect() {
    policy = await api("/api/v2/policy");
    renderPolicy(); element("connection").hidden = true; element("app").hidden = false; element("disconnect").hidden = false; element("token").value = "";
    await loadRuns();
    const requested = params.get("run") || sessionStorage.getItem("geo-measurement-run");
    if (requested && runs.some(run => run.run_id === requested)) await openRun(requested);
    else renderRun();
  }
  function disconnect() {
    pollVersion++; token = ""; policy = null; runs = []; current = null; jobs = []; artifact = null;
    element("app").hidden = true; element("disconnect").hidden = true; element("connection").hidden = false; element("policy-mode").textContent = "Not connected"; status("");
  }

  element("connection").addEventListener("submit", event => { event.preventDefault(); token = element("token").value.trim(); action(connect); });
  element("token-file").addEventListener("change", () => action(async () => {
    const file = element("token-file").files[0]; if (!file || file.size > 4096) throw new Error("Select the local API token file.");
    token = (await file.text()).trim(); element("token-file").value = "";
    try { await connect(); } catch (error) { token = ""; throw error; }
  }));
  element("disconnect").addEventListener("click", disconnect);
  element("refresh-runs").addEventListener("click", () => action(async () => { await loadRuns(); if (current) await openRun(current.run_id); }));
  element("brief-form").addEventListener("submit", event => {
    event.preventDefault(); action(async () => {
      const url = element("brief-url").value.trim();
      const host = new URL(url).hostname.toLowerCase().replace(/\.$/, "");
      const allowed = policy.allowed_domains.some(domain => host === domain.toLowerCase() || host.endsWith(`.${domain.toLowerCase()}`));
      if (!allowed) throw new Error(`This policy allows: ${policy.allowed_domains.join(", ")}. Use the default URL for the mock demo.`);
      current = await api("/api/v2/briefs", {method: "POST", body: {url, audience: element("brief-audience").value.trim(), goal: element("brief-goal").value.trim(), locale: element("brief-locale").value}});
      jobs = []; artifact = null; sessionStorage.setItem("geo-measurement-run", current.run_id); await loadRuns(); renderRun();
    });
  });
  element("close-evidence").addEventListener("click", () => element("evidence-dialog").close());
  const selectedTheme = params.get("scoutTheme") || "auto"; element("theme").value = selectedTheme;
  element("theme").addEventListener("change", () => {
    const value = element("theme").value;
    const theme = value === "auto" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : value;
    document.documentElement.setAttribute("data-theme", theme);
    const url = new URL(location.href); if (value === "auto") url.searchParams.delete("scoutTheme"); else url.searchParams.set("scoutTheme", value); history.replaceState(null, "", url);
  });
  setControls();
})();
</script>
</body>
</html>
