<script>
(() => {
  const param = new URLSearchParams(window.location.search).get("scoutTheme");
  const theme = param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  document.documentElement.setAttribute("data-theme", theme);
})();

<body>
<header>
  <div class="brand"><span class="brand-grid" aria-hidden="true"><span></span><span></span><span></span><span></span></span><div><h1>GEO Optimiser</h1><small>Measurement console</small></div></div>
  <div class="header-actions"><span id="policy-mode" class="mode">Not connected</span><a href="/chat?view=analysis">Evidence chat</a><select id="theme" aria-label="Color theme"><option value="auto">Auto</option><option value="light">Light</option><option value="dark">Dark</option></select><button id="disconnect" type="button" hidden>Disconnect</button></div>
</header>
<main>
  <form id="connection">
    <h2>Connect</h2>
    <label for="token-file">Local API token file</label><input id="token-file" type="file">
    <label for="token">Or enter local access token</label><div class="toolbar"><input id="token" type="password" autocomplete="off" required aria-label="Local access token"><button class="primary">Connect</button></div>
  </form>
  <div id="status" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="app" hidden>
    <div class="command-bar"><button id="new-measurement" type="button">New measurement</button><button id="toggle-runs" type="button" aria-expanded="false" aria-controls="run-list">Runs</button></div>
    <section id="brief-panel" class="brief-band" aria-labelledby="new-run-heading">
      <h2 id="new-run-heading">New measurement</h2>
      <form id="brief-form" class="form-grid">
        <div class="field url-field"><label for="brief-url">Public URL</label><input id="brief-url" type="url" required maxlength="2048" value="https://example.com/mock-page"><small id="brief-policy">Allowed hosts load after connection.</small></div>
        <div class="field"><label for="brief-audience">Audience</label><input id="brief-audience" required maxlength="1000" value="Research buyers"></div>
        <div class="field"><label for="brief-goal">Goal</label><input id="brief-goal" required maxlength="1000" value="Compare trusted options"></div>
        <div class="field"><label for="brief-locale">Locale</label><select id="brief-locale"></select></div>
        <button class="primary" type="submit">Create</button>
      </form>
    </section>
    <div class="workspace-grid">
      <aside class="run-sidebar" aria-labelledby="runs-heading"><div class="toolbar"><h2 id="runs-heading">Runs</h2><button id="refresh-runs" type="button">Refresh</button></div><div id="run-list" class="run-list"></div></aside>
      <article id="run-detail" class="run-detail"><div class="empty">Select a run or create a new measurement.</div></article>
    </div>
  </div>
</main>
<dialog id="evidence-dialog" aria-labelledby="evidence-heading"><div id="evidence-body" class="dialog-body"></div><div class="dialog-actions"><button id="close-evidence" type="button">Close</button></div></dialog>
<dialog id="brand-dialog" aria-labelledby="brand-heading"><form id="brand-form"><div class="dialog-body"><h2 id="brand-heading">Brand definition</h2><p id="brand-version" class="muted"></p><div id="saved-brand-fields" class="brand-fields"></div></div><div class="dialog-actions toolbar"><button id="close-brand" type="button">Cancel</button><button class="primary" type="submit">Save brand definition</button></div></form></dialog>
<script>
(() => {
  const element = id => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const activeStates = new Set(["preparing", "queued", "evaluating", "recommending"]);
  let token = "";
  let policy = null;
  let runs = [];
  let current = null;
  let jobs = [];
  let artifact = null;
  let busy = false;
  let editingQueries = false;
  let pollVersion = 0;
  let monitorController = null;
  let progressSnapshot = null;
  let progressAvailable = true;
  let viewVersion = 0;
  let selectedStage = null;
  let renderedRunId = null;
  let renderedStage = null;
  let assessmentData = null;
  let assessmentKey = null;
  let assessmentGeneration = 0;
  let assessmentQuery = null;
  let assessmentProfile = null;
  let assessmentView = "grounding";
  let strategyData = null;
  let strategyKey = null;
  let strategyGeneration = 0;
  let strategyView = "grounding";
  let brandTrigger = null;
  let brandEditVersion = 0;
  let brandEditRun = null;
  let brandDirty = false;
  const stages = ["Brief", "Prepare", "Approve", "Measure", "Recommendations", "Export"];
  const iconSources = {
    "refresh-cw": '<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>',
    archive: '<rect width="20" height="5" x="2" y="3" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/>',
    download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    pencil: '<path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/>',
    save: '<path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/><path d="M7 3v4a1 1 0 0 0 1 1h7"/>',
    square: '<rect width="18" height="18" x="3" y="3" rx="2"/>',
    play: '<polygon points="6 3 20 12 6 21 6 3"/>',
    plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
    x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  };
  let evidenceTrigger = null;

  function decorateButton(button, name, iconOnly = false) {
    if (!iconSources[name]) return;
    const label = button.textContent;
    const documentIcon = new DOMParser().parseFromString(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${iconSources[name]}</svg>`, "image/svg+xml").documentElement;
    const icon = document.importNode(documentIcon, true);
    icon.classList.add("icon"); icon.setAttribute("aria-hidden", "true"); icon.setAttribute("focusable", "false");
    button.setAttribute("aria-label", label); button.title = label;
    if (iconOnly) { button.replaceChildren(icon); button.classList.add("icon-only"); }
    else button.prepend(icon);
  }

  const status = (message, error = false) => {
    element("status").textContent = message;
    element("status").className = error ? "error" : "";
  };
  const textNode = (tag, text, className = "") => {
    const node = document.createElement(tag);
    node.textContent = text;
    node.className = className;
    return node;
  };
  const buttonNode = (label, id, className = "") => {
    const button = textNode("button", label, className);
    button.type = "button";
    button.id = id;
    const icon = {"refresh-run": "refresh-cw", "export-run": "archive", "download-artifact": "download", "approve-run": "check", "edit-queries": "pencil", "save-queries": "save", "cancel-job": "square", "prepare-run": "play", "evaluate-run": "play"}[id];
    if (icon) decorateButton(button, icon, id === "refresh-run");
    return button;
  };
  const delay = (milliseconds, signal) => new Promise(resolve => {
    const finish = () => { clearTimeout(timer); signal?.removeEventListener("abort", finish); resolve(); };
    const timer = setTimeout(finish, milliseconds);
    if (signal?.aborted) finish(); else signal?.addEventListener("abort", finish, {once: true});
  });

  function setControls() {
    for (const control of document.querySelectorAll("#app button, #app input, #app select, #app textarea")) control.disabled = busy || control.dataset.locked === "true";
    element("disconnect").disabled = busy;
    if (element("prepare-run")) element("prepare-run").disabled = busy || !element("prepare-confirm").checked;
    if (element("evaluate-run")) element("evaluate-run").disabled = busy || !element("evaluate-confirm").checked;
  }

  async function request(path, {method = "GET", body, signal} = {}) {
    const headers = {"Authorization": "Bearer " + token};
    if (body !== undefined) headers["Content-Type"] = "application/json";
    const response = await fetch(path, {
      method,
      headers,
      signal: signal ? AbortSignal.any([signal, AbortSignal.timeout(15000)]) : AbortSignal.timeout(15000),
      ...(body === undefined ? {} : {body: JSON.stringify(body)}),
      cache: "no-store",
      redirect: "error",
      credentials: "omit",
    });
    if (!response.ok) {
      let detail = `Local request failed (HTTP ${response.status}).`;
      try { detail = (await response.json()).detail || detail; } catch {}
      if (typeof detail !== "string") detail = "Check the submitted fields and try again.";
      const error = new Error(detail); error.status = response.status;
      const retryAfter = response.headers.get("Retry-After");
      error.retryAfter = retryAfter ? (Number.isFinite(Number(retryAfter)) ? Number(retryAfter) * 1000 : Math.max(0, Date.parse(retryAfter) - Date.now())) : 0;
      throw error;
    }
    return response;
  }
  async function api(path, options) { return (await request(path, options)).json(); }

  async function readProgress(runId, options) {
    const path = `/api/v2/runs/${encodeURIComponent(runId)}`;
    if (progressAvailable) {
      try { return await api(`${path}/progress`, options); }
      catch (error) {
        if (error.status !== 404 || error.message !== "Not Found") throw error;
        progressAvailable = false;
      }
    }
    const run = await api(path, options);
    const savedJobs = await api(`${path}/jobs`, options);
    const job = savedJobs[0];
    return {run_id: run.run_id, run_revision: run.revision, run_state: run.state,
      job_id: job?.job_id, job_type: job?.job_type, job_state: job?.state,
      queued_at: job?.created_at, last_activity_at: job?.updated_at || run.updated_at, operations: []};
  }

  async function action(work, pending = "Updating saved run...", success = "Saved.") {
    if (busy) return;
    stopMonitor();
    busy = true; setControls(); status(pending);
    try { await work(); status(success); }
    catch (error) {
      if (error.status === 401) { disconnect(); status("Access token not accepted by this server. Select its local API token file to reconnect.", true); }
      else if (error.status === 409 || error.status >= 500 || ["TimeoutError", "TypeError"].includes(error.name)) {
        let message = error.status === 409 ? error.message : "The request could not be confirmed.";
        if (current && !editingQueries) {
          try { await openRun(current.run_id); message += " Saved state refreshed. Review it before submitting again."; }
          catch { message += " Saved status is unavailable. Refresh before submitting again."; }
        } else message += " Refresh the saved run before submitting again; unsaved edits have been kept.";
        status(message + " No automatic retry.", true);
      }
      else if (error.name !== "AbortError") status(error.message + " No automatic retry.", true);
    }
    finally {
      busy = false; setControls();
      if (!monitorController && token && current && activeStates.has(current.state)) void pollRun();
    }
  }

  function stateLabel(value) { return value.replaceAll("-", " "); }
  function stageCount(run) {
    if (run.state === "exported") return 5;
    if (run.measurement) return 4;
    if (["failed", "cancelled", "needs-review"].includes(run.state)) return jobs[0]?.job_type === "evaluate" || run.approval ? 3 : 1;
    if (["queued", "evaluating", "recommending"].includes(run.state)) return 3;
    if (run.approval) return 3;
    if (run.state === "awaiting-query-approval") return 2;
    return 1;
  }

  function renderPolicy() {
    element("policy-mode").textContent = `${policy.execution_mode} / ${policy.profiles.length} profiles`;
    element("brief-policy").textContent = `Allowed ${policy.allowed_domains.length === 1 ? "host" : "hosts"}: ${policy.allowed_domains.join(", ")}`;
    const locale = element("brief-locale"); locale.replaceChildren(new Option(policy.locale, policy.locale));
  }

  function brandFields(target, prefix, definition = null) {
    target.replaceChildren();
    for (const [field, label, value, multiline] of [
      ["name", "Brand name", definition?.name || "", false],
      ["domains", "Brand-owned domains (one per line)", (definition?.domains || []).join("\n"), true],
      ["aliases", "Distinctive aliases (one per line)", (definition?.aliases || []).filter(alias => !alias.ambiguous).map(alias => alias.text).join("\n"), true],
      ["ambiguous", "Common-word aliases (one per line)", (definition?.aliases || []).filter(alias => alias.ambiguous).map(alias => alias.text).join("\n"), true],
    ]) {
      const wrapper = document.createElement("div"); wrapper.className = "field";
      const input = document.createElement(multiline ? "textarea" : "input"); input.id = `${prefix}-${field}`; input.value = value; input.maxLength = multiline ? 2540 : 120;
      if (field === "name") input.required = true;
      const labelNode = textNode("label", label); labelNode.htmlFor = input.id; wrapper.append(labelNode, input); target.append(wrapper);
    }
  }

  function readBrand(prefix) {
    const lines = field => element(`${prefix}-${field}`).value.split(/\r?\n/).map(value => value.trim()).filter(Boolean);
    const aliases = [...lines("aliases").map(text => ({text, ambiguous: false})), ...lines("ambiguous").map(text => ({text, ambiguous: true}))];
    const name = element(`${prefix}-name`).value.trim(); const domains = lines("domains");
    if (!name) throw new Error("Enter a brand name.");
    if (aliases.length > 10 || domains.length > 10 || aliases.some(alias => alias.text.length > 120)) throw new Error("Use at most ten aliases and ten domains; each alias may contain up to 120 characters.");
    return {name, aliases, domains};
  }

  function editBrand() {
    brandTrigger = document.activeElement; brandEditRun = current.run_id;
    const record = assessmentData?.brand_definition;
    brandEditVersion = record?.definition_version || 0;
    brandFields(element("saved-brand-fields"), "saved-brand", record?.definition);
    element("brand-version").textContent = `Assessment configuration${record ? ` / version ${record.definition_version}` : ""}. Approved queries and model inputs remain unchanged.`;
    brandDirty = false; element("brand-dialog").showModal();
  }

  function highlighted(text, matches, field) {
    const node = document.createElement("span");
    const spans = matches.filter(match => match.field === field).sort((left, right) => left.start - right.start || right.end - left.end);
    const characters = Array.from(text || ""); let position = 0;
    for (const span of spans) {
      if (span.start < position || span.start < 0 || span.end > characters.length) continue;
      node.append(document.createTextNode(characters.slice(position, span.start).join("")), textNode("mark", characters.slice(span.start, span.end).join("")));
      position = span.end;
    }
    node.append(document.createTextNode(characters.slice(position).join(""))); return node;
  }

  const metricRatio = metric => metric?.rate == null ? "N/A" : `${metric.numerator}/${metric.denominator}`;

  function brandContext(target, record, editId) {
    target.replaceChildren();
    const preparing = current.state === "draft" || activeStates.has(current.state) && !current.inputs;
    const description = record ? `${record.definition.name} / definition v${record.definition_version} / ${record.source === "page-analysis" ? "Inferred from page + model knowledge" : "User-defined"}`
      : preparing ? "Brand setup follows page analysis." : "Brand not identified. Brand metrics remain N/A.";
    target.append(textNode("p", description, "muted"));
    if (record) {
      const details = document.createElement("details"); details.append(textNode("summary", "Brand details"));
      details.append(textNode("p", `Aliases: ${record.definition.aliases.map(alias => `${alias.text}${alias.ambiguous ? " (ambiguous)" : ""}`).join(", ") || "None"}`),
        textNode("p", `Brand domains: ${record.definition.domains.join(", ") || "None"}`));
      if (record.source === "page-analysis" && current.page_analysis?.brand) {
        details.append(textNode("p", current.page_analysis.brand.rationale));
        for (const reference of current.page_analysis.brand.evidence) details.append(textNode("blockquote", reference.quote));
        details.append(textNode("p", "Model-generated setup; aliases and domain ownership are not independently verified.", "muted"));
      }
      target.append(details);
    }
    if (!preparing && assessmentData && !assessmentData.error) {
      const edit = buttonNode(record ? "Edit brand definition" : "Set brand", editId); decorateButton(edit, "pencil");
      edit.addEventListener("click", editBrand); target.append(edit);
    }
  }

  function assessmentMetrics(target, report) {
    const metrics = document.createElement("div"); metrics.className = "metrics";
    for (const [value, label] of [
      [metricRatio(report.grounding.brand_presence), "Web IQ packets with brand text"],
      [metricRatio(report.answer.brand_presence), "Answers mentioning brand"],
      [metricRatio(report.answer.source_citation_rate), "Supplied sources cited"],
      [metricRatio(report.answer.brand_sources_cited), "Brand-bearing sources cited"],
    ]) { const metric = document.createElement("div"); metric.className = "metric"; metric.append(textNode("strong", value), textNode("span", label)); metrics.append(metric); }
    target.append(metrics);
  }

  function sourceBlock(source, trace = null) {
    const block = document.createElement("section"); block.className = "assessment-source";
    const heading = document.createElement("h3"); heading.append(highlighted(source.title || source.evidence_id, source.brand.matches, "title"));
    const link = document.createElement("a"); link.textContent = source.url; link.href = source.url; link.target = "_blank"; link.rel = "noopener noreferrer";
    const facts = document.createElement("div"); facts.className = "assessment-facts";
    facts.append(textNode("strong", `Position ${source.returned_position ?? "N/A"} / ${source.evidence_id}`),
      textNode("span", `Brand text: ${source.brand.status}`), textNode("span", `Brand-owned host: ${source.brand_owned_host ? "yes" : "no"}`), textNode("span", `${source.target_relation} / ${source.provenance}`));
    if (trace) facts.append(textNode("strong", trace.cited == null ? "Citation unknown" : trace.cited ? "Model-reported citation" : "Not cited"));
    const passage = document.createElement("blockquote"); passage.append(highlighted(source.excerpt, source.brand.matches, "excerpt"));
    block.append(heading, link, facts, passage);
    if (trace) {
      block.append(textNode("p", "Selection reason not recorded", "muted"));
      if (!trace.shared_wording.length) block.append(textNode("p", trace.cited == null ? "Answer unavailable; shared wording is not assessable." : "No qualifying exact text overlap", "muted"));
      for (const overlap of trace.shared_wording) block.append(textNode("p", `Shared wording${overlap.non_unique ? " (also shared with other sources)" : ""}: ${overlap.answer_quote}`));
    }
    const inspect = buttonNode("Inspect saved evidence", "");
    inspect.addEventListener("click", () => showEvidence(source)); block.append(inspect); return block;
  }

  function renderAssessmentAreas() {
    if (!current || !element("assessment-detail")) return;
    const target = element("assessment-detail"); const summary = element("assessment-summary");
    target.replaceChildren(); summary.replaceChildren();
    const data = assessmentData; const report = data?.assessment;
    const record = data?.brand_definition;
    const exportButton = element("export-run");
    if (exportButton) exportButton.dataset.locked = String(!data || Boolean(data.error && !data.legacyApi));
    document.querySelectorAll(".saved-brand-context").forEach((node, index) => brandContext(node, record, `edit-brand-context-${index}`));
    const heading = textNode("h2", "Grounding and answer assessment"); target.append(heading);
    if (data?.error) {
      target.append(textNode("p", data.error, "stage-notice warning"));
      const retry = buttonNode("Reload assessment", "reload-assessment"); decorateButton(retry, "refresh-cw");
      retry.addEventListener("click", () => { assessmentKey = null; void ensureAssessment(); }); target.append(retry);
    } else if (!data) target.append(textNode("p", "Loading saved assessment...", "muted"));
    else {
      const context = document.createElement("div"); brandContext(context, record, "edit-brand"); target.append(context);
      if (!report) target.append(textNode("p", data.status === "unavailable-no-saved-measurement" ? "No saved measurement is available for analysis." : "Detailed assessment awaits saved measurement results.", "stage-notice"));
    }
    const fallback = element("legacy-results");
    if (fallback) { fallback.hidden = Boolean(report); if (report) fallback.replaceChildren(); }
    setControls();
    if (!current.measurement) return;
    summary.append(textNode("h2", "Grounding and answer"));
    const review = buttonNode("Review measurement", "review-measurement"); review.addEventListener("click", () => selectStage(3));
    if (report) assessmentMetrics(summary, report);
    else summary.append(textNode("p", data?.error || "Assessment pending. Saved measurement remains available.", "muted"));
    summary.append(review);
    if (!report) { setControls(); return; }
    if (record) {
      const download = buttonNode("Download assessment ZIP", "download-assessment"); decorateButton(download, "download");
      download.addEventListener("click", () => action(downloadAssessment, "Retrieving assessment...", "Assessment download started.")); summary.append(download);
    }
    assessmentMetrics(target, report);
    target.append(textNode("p", `Search completion: ${metricRatio(report.grounding.coverage)}. Answer completion: ${metricRatio(report.answer.coverage)}. Ambiguous-only packets: ${report.grounding.ambiguous_packets}; answers: ${report.answer.ambiguous_answers}.`, "muted"));
    const selectors = document.createElement("div"); selectors.className = "assessment-selectors";
    const querySelect = document.createElement("select"); querySelect.id = "assessment-query";
    const profileSelect = document.createElement("select"); profileSelect.id = "assessment-profile";
    for (const query of report.queries) querySelect.add(new Option(`${query.query_id}: ${query.chat_query}`, query.query_id));
    for (const profile of current.inputs.profiles) profileSelect.add(new Option(profile.profile_id, profile.profile_id));
    if (report.queries.some(query => query.query_id === assessmentQuery)) querySelect.value = assessmentQuery;
    if (current.inputs.profiles.some(profile => profile.profile_id === assessmentProfile)) profileSelect.value = assessmentProfile;
    assessmentQuery = querySelect.value; assessmentProfile = profileSelect.value;
    for (const [select, label] of [[querySelect, "Query"], [profileSelect, "Answer profile"]]) { const wrapper = document.createElement("div"); wrapper.className = "field"; const name = textNode("label", label); name.htmlFor = select.id; wrapper.append(name, select); selectors.append(wrapper); }
    target.append(selectors);
    const tabs = document.createElement("div"); tabs.className = "assessment-tabs"; tabs.setAttribute("role", "tablist"); tabs.setAttribute("aria-label", "Evidence layers");
    const content = document.createElement("div"); content.id = "assessment-view"; content.setAttribute("role", "tabpanel"); content.tabIndex = 0;
    const draw = () => {
      assessmentQuery = querySelect.value; assessmentProfile = profileSelect.value;
      const query = report.queries.find(item => item.query_id === assessmentQuery);
      const answer = report.answers.find(item => item.query_id === assessmentQuery && item.profile_id === assessmentProfile);
      content.replaceChildren(); content.setAttribute("aria-labelledby", `assessment-tab-${assessmentView}`);
      for (const button of tabs.children) { const selected = button.dataset.view === assessmentView; button.setAttribute("aria-selected", String(selected)); button.tabIndex = selected ? 0 : -1; }
      content.append(textNode("h3", assessmentView === "grounding" ? "Web IQ grounding evidence" : assessmentView === "answer" ? "LLM answer and reported citations" : "Supplied evidence to final answer"));
      content.append(textNode("p", assessmentView === "grounding" ? query.grounding_query : query.chat_query, "grounding"));
      if (assessmentView === "grounding") {
        content.append(textNode("p", `${query.status} / ${query.sources.length} sources returned / brand text: ${query.brand_status}`));
        if (!query.sources.length) content.append(textNode("p", query.status === "completed" ? "Search completed with no sources." : "Retrieval unavailable; brand presence is unknown.", "muted"));
        for (const source of query.sources) content.append(sourceBlock(source));
      } else if (answer) {
        content.append(textNode("p", `${answer.status} / brand text: ${answer.brand.status} / ${metricRatio(answer.source_citation_rate)} supplied sources cited / exact target cited: ${answer.exact_page_cited == null ? "unknown" : answer.exact_page_cited ? "yes" : "no"}`));
        if (answer.unsupported_citation_ids.length) content.append(textNode("p", `Unsupported citation IDs: ${answer.unsupported_citation_ids.join(", ")}`, "stage-notice warning"));
        if (assessmentView === "answer") {
          const paragraph = document.createElement("p"); paragraph.className = "assessment-answer"; paragraph.append(highlighted(answer.answer, answer.brand.matches, "answer")); content.append(paragraph);
          content.append(textNode("p", `Model-reported valid citations: ${answer.valid_citation_ids.join(", ") || "None"}`, "muted"));
        } else {
          const brandUse = answer.status !== "completed" || !answer.brand_source_count ? "N/A" : `${answer.brand_cited_count}/${answer.brand_source_count}`;
          content.append(textNode("p", `${brandUse} brand-bearing sources cited. Uncited does not mean unused; citation is not proof of claim support.`, "stage-notice"));
          for (const source of query.sources) content.append(sourceBlock(source, answer.sources.find(item => item.evidence_id === source.evidence_id)));
        }
      }
    };
    for (const [view, label] of [["grounding", "Grounding evidence"], ["answer", "Answer and citations"], ["trace", "Source trace"]]) {
      const tab = buttonNode(label, `assessment-tab-${view}`); tab.dataset.view = view; tab.setAttribute("role", "tab"); tab.setAttribute("aria-controls", content.id);
      tab.addEventListener("click", () => { assessmentView = view; draw(); });
      tab.addEventListener("keydown", event => {
        if (!["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) return;
        event.preventDefault(); const buttons = [...tabs.children]; const index = buttons.indexOf(tab);
        const next = event.key === "Home" ? 0 : event.key === "End" ? buttons.length - 1 : (index + (event.key === "ArrowRight" ? 1 : -1) + buttons.length) % buttons.length;
        buttons[next].click(); buttons[next].focus();
      }); tabs.append(tab);
    }
    querySelect.addEventListener("change", draw); profileSelect.addEventListener("change", draw);
    target.append(tabs, content); draw();
    const limits = document.createElement("details"); limits.append(textNode("summary", "Assessment method and limits"));
    for (const limitation of report.limitations) limits.append(textNode("p", limitation, "muted")); target.append(limits);
    setControls();
  }

  async function ensureAssessment() {
    if (!current || !token || activeStates.has(current.state)) return;
    const key = `${current.run_id}:${current.revision}`;
    if (assessmentKey === key) { renderAssessmentAreas(); return; }
    assessmentKey = key; assessmentData = null; const generation = ++assessmentGeneration;
    const runId = current.run_id; const revision = current.revision; renderAssessmentAreas();
    try {
      const data = await api(`/api/v2/runs/${encodeURIComponent(runId)}/evidence-assessment`);
      if (generation !== assessmentGeneration || current?.run_id !== runId || current.revision !== revision || !token) return;
      if (data.run_revision !== revision) throw new Error("Run changed. Refresh the saved run before assessing it.");

  async function ensureContentStrategy() {
    if (!current?.measurement || !token || activeStates.has(current.state)) return;
    const runId = current.run_id; const revision = current.revision; const key = `${runId}:${revision}`;
    if (strategyKey === key) return;
    strategyKey = key; strategyData = null; const generation = ++strategyGeneration; renderContentStrategy();
    try {
      const data = await api(`/api/v2/runs/${encodeURIComponent(runId)}/content-strategy`);
      if (generation !== strategyGeneration || current?.run_id !== runId || current.revision !== revision || !token) return;
      if (data.run_revision !== revision || !data.report) throw new Error("Saved recommendations are not ready. Refresh the run.");
      strategyData = data;
    } catch (error) {
      if (generation !== strategyGeneration || current?.run_id !== runId || current.revision !== revision || !token) return;
      strategyData = {error: error.status === 404 ? "Recommendations are unavailable on this API. Restart the updated API to enable them." : error.message};
    }
    renderContentStrategy();
  }

  async function downloadContentStrategy() {
    const report = strategyData?.report;
    if (!report || !current?.measurement) throw new Error("Load saved recommendations before downloading.");
    const runId = current.run_id;
    const response = await request(`/api/v2/runs/${encodeURIComponent(runId)}/content-strategy/download?measurement_hash=${report.measurement_hash}`);
    const url = URL.createObjectURL(await response.blob());
    const link = document.createElement("a"); link.href = url; link.download = `geo-content-strategy-${runId}.zip`; document.body.append(link); link.click(); link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 0);
  }

        const updated = {
          ...query,
          chat_query: value("chat_query"),
          grounding_query: value("grounding_query"),

        };

        return updated;
      });
      current = await api(`/api/v2/runs/${encodeURIComponent(run.run_id)}/queries`, {method: "PUT", body: {expected_revision: run.revision, queries}});

        if (!selected) throw new Error(`Choose a decision for ${task.task_id}.`);
        return {task_id: task.task_id, decision: selected.value};

      current = response.run; jobs = jobs.map(item => item.job_id === response.job.job_id ? response.job : item); renderRun(); await loadRuns();

  const operationNames = {

  function stopMonitor() {
    pollVersion++; monitorController?.abort(); monitorController = null;
  }

  async function loadRuns() {
    const view = viewVersion;

    runs = next; renderRuns();

  for (const [id, name, iconOnly] of [["new-measurement", "plus", false], ["refresh-runs", "refresh-cw", true], ["close-evidence", "x", true]]) decorateButton(element(id), name, iconOnly);
  setControls();
})();
