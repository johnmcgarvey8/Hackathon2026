[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-agent"
version = "0.1.0"
description = "Approval-gated GEO agent backend"
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.13.5",
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "PyYAML==6.0.3",
    "python-dotenv==1.2.1",
    "httpx==0.28.1",
    "openai==2.54.0",
    "anthropic==0.125.0",
    "agent-framework-core==1.17.0",
    "agent-framework-openai==1.14.2",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx==0.28.1", "debugpy==1.8.21"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
geo_agent = ["chat.html"]